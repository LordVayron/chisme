name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked
      - name: Test
        # Credential Manager and the process list aren't usable on CI runners.
        run: cargo test --release --locked --lib -- --skip win::creds --skip win::apps
      - name: Clippy
        run: cargo clippy --release --locked

name: Bug report
description: Something doesn't work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Chisme version
      placeholder: "0.2.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version and GPU
      placeholder: "Windows 11 23H2, NVIDIA RTX 3060"
  - type: textarea
    id: devices
    attributes:
      label: Output of `chisme devices` (for capture problems)
      render: text
